<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Lottery - Number Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎰 Mass Lottery</h1>
            <p class="subtitle">Generate Your Lucky Numbers</p>
        </header>

        <main>
            <div class="game-selector">
                <label for="game-select">Choose a Game:</label>
                <select id="game-select">
                    <option value="mega_millions">Mega Millions</option>
                    <option value="powerball">Powerball</option>
                    <option value="megabucks">Megabucks</option>
                    <option value="mass_cash">Mass Cash</option>
                    <option value="lucky_for_life">Lucky For Life</option>
                    <option value="the_numbers_game">The Numbers Game</option>
                </select>
            </div>

            <button id="generate-btn" class="btn-generate">Generate Numbers</button>

            <div id="result-container" class="result-container hidden">
                <div class="game-name" id="game-name"></div>
                
                <div class="numbers-section">
                    <h3>Your Numbers:</h3>
                    <div class="numbers-display" id="numbers-display"></div>
                </div>

                <div id="bonus-section" class="bonus-section hidden">
                    <div class="bonus-label">Bonus Ball:</div>
                    <div class="bonus-ball" id="bonus-ball"></div>
                </div>

                <button id="copy-btn" class="btn-copy">Copy Numbers</button>
                <button id="new-btn" class="btn-new">Generate New</button>
            </div>

            <div id="error-message" class="error hidden"></div>
            <div id="loading" class="loading hidden">Generating...</div>
        </main>

        <footer>
            <p>Remember, lottery numbers are random. Play responsibly! 🍀</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
